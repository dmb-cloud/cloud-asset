<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>กำลังเข้าสู่ระบบผ่าน DMS SSO...</title>

  <link rel="icon" type="image/x-icon" href="img/ico_logo@2x.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Noto Sans Thai', sans-serif;
      background-image: url('img/cyber-claims.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    .bg-overlay { background-color: rgba(15, 23, 42, 0.4); min-height: 100vh; width: 100%; }
  </style>
</head>
<body class="m-0 p-0">

  <div class="bg-overlay flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center space-y-4 border-t-4 border-[#122e5a]">
      <div id="iconContainer">
        <i id="loadingIcon" class="fa-solid fa-circle-notch fa-spin text-5xl text-[#122e5a]"></i>
      </div>
      <h2 id="statusTitle" class="text-xl font-bold text-slate-800">DMS SSO</h2>
      <p id="statusMessage" class="text-sm text-slate-600 leading-relaxed">กำลังยืนยันตัวตนผ่าน DMS SSO...</p>
      <div id="errorAction" class="hidden pt-2">
        <a href="auth.html" class="inline-block bg-[#122e5a] text-white text-xs font-bold py-2.5 px-5 rounded-lg hover:bg-blue-900 transition">
          <i class="fa-solid fa-arrow-left mr-1.5"></i> กลับไปหน้าเข้าสู่ระบบ
        </a>
      </div>
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbwvH1cILtGrd2Ap12P0Ykyc9_lXtUmgEb-KjHHuG94ZKLTbHJLY16Z15GL5m5HXqgQa/exec";

    document.addEventListener("DOMContentLoaded", async function () {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const state = urlParams.get('state');
      const savedState = sessionStorage.getItem('sso_state');

      // ล้าง code/state ออกจาก address bar ทันที (กันหลุดไปกับ history / referrer)
      history.replaceState(null, '', window.location.pathname);

      if (urlParams.get('error')) {
        showError("DMS SSO ปฏิเสธการเข้าสู่ระบบ หรือยกเลิกการทำรายการ");
        return;
      }
      if (!code) {
        showError("ไม่พบรหัสยืนยันตัวตน (Authorization Code)");
        return;
      }
      if (!savedState || state !== savedState) {
        showError("คำขอเข้าสู่ระบบไม่ถูกต้อง (State Mismatch) กรุณาเริ่มเข้าสู่ระบบใหม่");
        return;
      }
      sessionStorage.removeItem('sso_state');

      try {
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          // ✅ ส่ง state ไปให้ server ตรวจซ้ำอีกชั้น (ฝั่ง browser เชื่อถือไม่ได้)
          body: JSON.stringify({ action: 'handleSsoCallback', payload: { code: code, state: state } })
        });

        const res = await response.json();

        if (res && res.success && res.data && res.data.success && res.data.token) {
          const d = res.data;
          sessionStorage.setItem('access_token', d.token);
          sessionStorage.setItem('token_exp', String(d.expiresAt || 0));
          sessionStorage.setItem('mfa_agency', d.user.agency || '');
          sessionStorage.setItem('mfa_email', d.user.email || '');
          sessionStorage.setItem('mfa_name', d.user.fullname || '');

          document.getElementById('statusMessage').textContent = "ยืนยันตัวตนสำเร็จ กำลังนำท่านเข้าสู่ระบบ...";
          setTimeout(() => { window.location.href = "index.html"; }, 800);
        } else {
          showError((res.data && res.data.message) || res.message || "ไม่สามารถเข้าสู่ระบบผ่าน DMS SSO ได้");
        }
      } catch (err) {
        showError("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์ กรุณาลองใหม่อีกครั้ง");
      }
    });

    function showError(msg) {
      document.getElementById('loadingIcon').className = "fa-solid fa-circle-xmark text-5xl text-rose-500";
      document.getElementById('statusTitle').textContent = "เข้าสู่ระบบไม่สำเร็จ";
      document.getElementById('statusMessage').textContent = msg;
      document.getElementById('statusMessage').className = "text-sm text-rose-600 font-medium leading-relaxed";
      document.getElementById('errorAction').classList.remove('hidden');
    }
  </script>
</body>
</html>
