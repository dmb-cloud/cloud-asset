<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - ไม่พบหน้าเว็บ | DMS Cloud Registry</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style> 
    body { 
      font-family: 'Noto Sans Thai', sans-serif; 
      /* 🔴 ดึงรูปภาพพื้นหลังจาก img/cyber-claims.webp */
      background-image: url('img/cyber-claims.webp');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    } 
    
    .glass-panel {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
  </style>

</head>
<body class="flex flex-col items-center justify-center min-h-screen relative p-4">

  <!-- แผ่นกรองสีดำซ้อนทับภาพพื้นหลัง -->
  <div class="absolute inset-0 bg-black/60 z-0"></div>

  <!-- การ์ดข้อความ Glassmorphism -->
  <div class="glass-panel w-full max-w-md rounded-2xl p-8 relative z-10 border-t-8 border-rose-600 text-center shadow-2xl">
    
    <!-- ไอคอนเตือน -->
    <div class="w-20 h-20 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-4 text-rose-600 text-3xl shadow-inner">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>

    <!-- ข้อความแจ้งเตือน -->
    <h1 class="text-4xl font-black text-slate-800 tracking-wider mb-1">404</h1>
    <h2 class="text-lg font-bold text-slate-700 mb-2">ไม่พบหน้าที่คุณต้องการ</h2>
    <p class="text-xs text-slate-500 mb-6 leading-relaxed">
      ที่อยู่เว็บอาจไม่ถูกต้อง หรือหน้านี้ถูกย้ายไปแล้ว<br>
      ระบบกำลังนำคุณกลับไปยังหน้าเข้าสู่ระบบภายใน <span id="countdown" class="font-bold text-rose-600">3</span> วินาที...
    </p>

    <!-- ปุ่มกดกลับหน้าเข้าสู่ระบบ -->
    <a href="auth.html" class="w-full bg-[#122e5a] hover:bg-blue-900 text-white text-xs font-bold py-3 px-4 rounded-lg transition inline-flex items-center justify-center shadow-md">
      <i class="fa-solid fa-house mr-2"></i> กลับสู่หน้าเข้าสู่ระบบทันที
    </a>

  </div>

  <!-- Footer ลิขสิทธิ์ -->
  <div class="absolute bottom-4 left-0 w-full px-6 flex justify-between items-center text-white/80 text-[11px] font-light z-10 drop-shadow-md">
    <span>Copyright © สำนักดิจิทัลการแพทย์</span>
    <span>DMS Cloud Registry</span>
  </div>

  <script>
    // 🟢 สคริปต์นับถอยหลัง 3 วินาทีแบบแสดงตัวเลขบนหน้าจอ
    let timeLeft = 3;
    const countdownElement = document.getElementById('countdown');
    
    const timer = setInterval(() => {
      timeLeft--;
      countdownElement.textContent = timeLeft;
      
      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = "auth.html"; // 📍 แก้ให้เป็นตัวพิมพ์เล็กทั้งหมด
      }
    }, 1000);
  </script>

</body>
</html>
